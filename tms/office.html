<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot office · TMS ledger</title>
<style>
  html,body{margin:0;height:100%;background:#2b2433;color:#f4efe6;font:14px/1.45 system-ui,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:#1e1826;border-bottom:1px solid #3a3144;flex-shrink:0}
  header b{font-size:15px}header a{color:#cbbfd4;text-decoration:none}header a:hover,header a[aria-current="page"]{color:#fff}
  header nav{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
  #office-desc{flex-basis:100%;margin:0;color:#cbbfd4;font-size:13px}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
  canvas{display:block;aspect-ratio:16/9;width:min(100%,calc((100dvh - 4.5rem)*1.7778));height:auto;max-width:100%;max-height:calc(100dvh - 4.5rem)}
  @supports (width:1cqw){canvas{width:min(100cqw,calc(100cqh*16/9));max-height:100cqh}}
</style>
</head>
<body>
<header><b>TMS ledger</b><nav><a href="/">Home</a><a href="/submit">Submit</a><a href="/dashboard">Dashboard</a><a href="/docs">Docs</a><a href="/office" aria-current="page">Office</a></nav>
<p id="office-desc">Little bots file papers into cabinets, pin claims to the corkboard, and ponder the string between them. A yellow card with no string is a hypothesis. The marks on every sheet are only squiggles.</p></header>
<main id="stage">
<canvas id="c" role="img" aria-label="Animated office of little bots filing papers and pinning them to a corkboard" aria-describedby="office-desc"></canvas>
</main>
<script>
/*
  Bot Office: a self-contained, looping ambient animation. No network deps.

  URL params:
    ?auto=0      stop the random paper drops (drive it from events instead)
    ?seed=123    change the random layout/behaviour
    ?capture=1   no realtime loop; call window.__advance(seconds) to step + render (for video export)

  prefers-reduced-motion: reduce pauses the loop on the opening frame.

  Event hook (for driving it from real, anonymized tms counts later):
    botOffice.evidence(n)     -> n sheets drop out of the tube into the inbox
    botOffice.claim(n)        -> n yellow claim cards drop into the inbox
    botOffice.link()          -> next evidence pinned to the board gets a red string
    botOffice.contradiction() -> next string drawn is a blue "contradiction" string
  Papers only ever show squiggles, so nothing real is revealed.
*/
(() => {
const W = 960, H = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
const AUTO = params.get('auto') !== '0';

let painted = false;
function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width === w && cv.height === h) return;
  cv.width = w; cv.height = h; // clears the bitmap
  if (painted) render();
}
window.addEventListener('resize', resize);
const stage = document.getElementById('stage');
if (window.ResizeObserver && stage) new ResizeObserver(resize).observe(stage);
resize();

// ---------- utils ----------
let seed = (parseInt(params.get('seed')) || 20261021) | 0;
function rnd() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
let T = 0;

// ---------- papers ----------
let paperId = 0;
function newPaper(kind) {
  const n = kind === 'claim' ? 3 : (rr(4, 6.99) | 0);
  const lines = [];
  for (let i = 0; i < n; i++) lines.push({ len: rr(.45, .95), ph: rr(0, 6.28), fr: rr(.28, .42) });
  return { id: paperId++, kind, lines, photo: kind === 'ev' && rnd() < .35, tint: pick(['#ffffff', '#fbf8f0', '#f4f7ff']) };
}
const SIZE = { ev: [34, 42], claim: [42, 30] };
function drawPaper(p, x, y, w, h, rot = 0, alpha = 1, shadow = true) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  if (shadow) { ctx.fillStyle = 'rgba(60,35,20,.20)'; ctx.fillRect(-w / 2 + 2, -h / 2 + 3, w, h); }
  ctx.fillStyle = p.kind === 'claim' ? '#ffe39a' : p.tint; ctx.fillRect(-w / 2, -h / 2, w, h);
  const f = Math.min(w, h) * .2;
  ctx.fillStyle = 'rgba(0,0,0,.07)'; ctx.beginPath(); ctx.moveTo(w / 2 - f, -h / 2); ctx.lineTo(w / 2, -h / 2 + f); ctx.lineTo(w / 2 - f, -h / 2 + f); ctx.closePath(); ctx.fill();
  let top = -h / 2 + h * .16;
  if (p.photo) { ctx.fillStyle = '#c4d0e4'; ctx.fillRect(-w / 2 + w * .14, top, w * .42, h * .26); top += h * .32; }
  ctx.strokeStyle = p.kind === 'claim' ? '#b98d36' : '#98a2b8';
  ctx.lineWidth = Math.max(.7, h * (p.kind === 'claim' ? .055 : .035)); ctx.lineCap = 'round';
  const n = p.lines.length, gap = (h / 2 - h * .1 - top) / n;
  for (let i = 0; i < n; i++) {
    const L = p.lines[i], ly = top + gap * (i + .5), x0 = -w / 2 + w * .14, x1 = x0 + w * .72 * L.len;
    ctx.beginPath();
    for (let xx = x0; xx <= x1; xx += 1) { const yy = ly + Math.sin(xx / w * L.fr * 40 + L.ph) * h * .028; xx === x0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); }
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- world ----------
const TUBE = { x: 88, bottom: 192 };
const TRAY = { x: 90, y: 262 };
const inbox = { stack: [], max: 6, falling: [], lock: null };
let tubePulse = 0, dropTimer = 1, pendingDrops = [], pendingTimer = 0;
let forceLink = 0, forceContra = 0;
function dropPaper(kind) {
  if (inbox.stack.length + inbox.falling.length >= inbox.max) return false;
  inbox.falling.push({ paper: newPaper(kind), t: 0, rot: rr(-.3, .3) }); tubePulse = 1; return true;
}
for (let i = 0; i < 3; i++) inbox.stack.push(newPaper(i === 1 ? 'claim' : 'ev'));

const CABS = [0, 1, 2].map(i => ({ x: 296 + i * 62, w: 58, top: 150, drawers: [0, 1, 2].map(() => ({ open: 0, target: 0, busy: false, flash: 0 })) }));
const drawerY = (d) => 158 + d * 49; // top of drawer face, height 44

const BOARD = { x: 540, y: 38, w: 385, h: 215 };
const cork = []; for (let i = 0; i < 260; i++) cork.push([rr(0, 1), rr(0, 1), rr(.6, 1.6), rnd() < .5]);
const slots = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) slots.push({ x: BOARD.x + 42 + c * 60 + rr(-6, 6), y: BOARD.y + 50 + r * 60 + rr(-5, 5), item: null, reserved: false });
const items = [], strings = [], fx = [];
const PIN_COLORS = ['#e2574c', '#4c8be2', '#46b37b', '#e2b84c', '#9b6ae2'];
function pinPos(it) { const h = SIZE[it.paper.kind][1]; return { x: it.slot.x, y: it.slot.y - h / 2 + 5 }; }
function addItem(paper, slot, instant) {
  const it = { paper, slot, rot: rr(-.08, .08), born: T, alpha: 1, pop: instant ? 1 : 0, pin: pick(PIN_COLORS), removing: false };
  slot.item = it; slot.reserved = false; items.push(it); return it;
}
function addString(a, b, kind, instant) { const s = { a, b, kind, prog: instant ? 1 : 0, alpha: 1, fading: false, glow: 0 }; strings.push(s); return s; }
let archiving = false;

// initial board
(() => {
  const claimSlots = [2, 7, 16], evSlots = [0, 5, 9, 12, 14];
  const cl = claimSlots.map(i => addItem(newPaper('claim'), slots[i], true));
  const ev = evSlots.map(i => addItem(newPaper('ev'), slots[i], true));
  cl.forEach(c => c.born -= 30); ev.forEach(e => e.born -= 20);
  addString(ev[0], cl[0], 'sup', true); addString(ev[1], cl[0], 'sup', true);
  addString(ev[2], cl[1], 'sup', true); addString(ev[3], cl[1], 'contra', true);
  addString(ev[4], cl[2], 'sup', true);
})();

// ---------- bots ----------
const mv = (x, y) => ({ type: 'move', x, y });
const wait = t => ({ type: 'wait', t });
const until = cond => ({ type: 'until', cond });
const anim = (dur, update) => ({ type: 'anim', dur, update });
const call = fn => ({ type: 'call', fn });

let botId = 0;
class Bot {
  constructor(role, x, y, color, accent) {
    Object.assign(this, { id: botId++, role, x, y, color, accent, face: 1, view: 'front', moving: false, walk: rr(0, 6), speed: rr(62, 78),
      carry: null, carryScale: 1, arm: null, mood: null, ponder: null, idea: 0, hopY: 0, tilt: 0, blinkT: rr(1, 4), cur: null });
    this.gen = ROLES[role](this);
  }
  hand() {
    if (this.arm) { const s = this.shoulder(); const p = this.arm.p; return { x: lerp(s.x, this.arm.tx, p), y: lerp(s.y, this.arm.ty, p) }; }
    return { x: this.x + this.face * 2, y: this.y - 24 - this.bob() };
  }
  shoulder() { const side = this.arm ? Math.sign(this.arm.tx - this.x) || 1 : this.face; return { x: this.x + side * 13, y: this.y - 30 - this.bob() }; }
  bob() { return (this.moving ? Math.abs(Math.sin(this.walk)) * 2.5 : Math.sin(T * 2 + this.id) * .8) + this.hopY; }
  update(dt) {
    this.blinkT -= dt; if (this.blinkT < -0.12) this.blinkT = rr(2, 5);
    this.idea = Math.max(0, this.idea - dt * .6);
    for (let guard = 0; guard < 5; guard++) {
      if (!this.cur) { const r = this.gen.next(); if (r.done) { this.gen = ROLES[this.role](this); continue; } this.cur = r.value; this.cur.el = 0; }
      const a = this.cur; let done = false;
      if (a.type === 'move') {
        const dx = a.x - this.x, dy = a.y - this.y, d = Math.hypot(dx, dy), sp = this.speed * dt;
        this.view = 'front';
        if (d <= sp) { this.x = a.x; this.y = a.y; done = true; this.moving = false; }
        else { this.x += dx / d * sp; this.y += dy / d * sp; this.walk += dt * 11; this.moving = true; if (Math.abs(dx) > 1) this.face = Math.sign(dx); if (dy < -Math.abs(dx) * 2) this.view = 'back'; }
      } else if (a.type === 'wait') { a.el += dt; done = a.el >= a.t; }
      else if (a.type === 'until') { done = a.cond(this); }
      else if (a.type === 'anim') { a.el += dt; const p = clamp(a.el / a.dur, 0, 1); a.update(this, p); done = p >= 1; }
      else if (a.type === 'call') { a.fn(this); done = true; }
      if (done) { this.cur = null; if (a.type === 'call' || a.type === 'until') continue; }
      break;
    }
  }
}

function* reach(b, tx, ty, dur, onDone) {
  b.arm = { tx, ty, p: 0 };
  yield anim(dur, (b, p) => { b.arm.p = ease(p); });
  if (onDone) onDone(b);
  yield anim(dur * .6, (b, p) => { b.arm.p = 1 - ease(p); });
  b.arm = null;
}
function* happy(b, t = .7) { b.view = 'front'; b.mood = 'happy'; yield anim(t, (b, p) => { b.hopY = Math.sin(p * Math.PI) * 6; }); b.hopY = 0; b.mood = null; }

function* fetchPaper(b) {
  const k = rnd() * 4 | 0;
  yield mv(118 + k * 26 + rr(-4, 4), 334 + (k % 2) * 12);
  b.face = -1;
  yield until(() => { if (inbox.stack.length && !inbox.lock) { inbox.lock = b; return true; } return false; });
  b.view = 'back';
  b.arm = { tx: TRAY.x, ty: TRAY.y - inbox.stack.length * 3, p: 0 };
  yield anim(.45, (b, p) => { b.arm.p = ease(p); });
  b.carry = inbox.stack.pop(); b.carryScale = .55; inbox.lock = null;
  yield anim(.35, (b, p) => { b.arm.p = 1 - ease(p); });
  b.arm = null; b.view = 'front';
}

function* fileInto(b) {
  let c = 0, d = 0;
  for (let t = 0; t < 12; t++) { c = rnd() * 3 | 0; d = rnd() * 3 | 0; if (!CABS[c].drawers[d].busy) break; }
  const cab = CABS[c], dr = cab.drawers[d]; dr.busy = true;
  const side = c === 0 ? -1 : c === 2 ? 1 : pick([-1, 1]);
  yield mv(cab.x + cab.w / 2 + side * 36, 336 + rr(-3, 3));
  b.view = 'back';
  dr.target = 1; yield wait(.45);
  const startScale = b.carryScale;
  yield* reach(b, cab.x + cab.w / 2, drawerY(d) - 4, .5, b => { b.carry = null; dr.flash = 1; });
  dr.target = 0; dr.busy = false;
  yield wait(.25);
  yield* happy(b);
}

function* pinToBoard(b) {
  const free = slots.filter(s => !s.item && !s.reserved);
  if (!free.length) { yield* fileInto(b); return; }
  const s = pick(free); s.reserved = true;
  yield mv(s.x + rr(-10, 10), 330 + rr(-3, 3));
  b.view = 'back';
  b.arm = { tx: s.x, ty: s.y, p: 0 };
  yield anim(1.0, (b, p) => { b.arm.p = ease(p); b.carryScale = lerp(.55, 1, ease(p)); });
  const it = addItem(b.carry, s, false); b.carry = null; b.carryScale = 1;
  const pp = pinPos(it); fx.push({ x: pp.x, y: pp.y, t: 0, kind: 'ring' });
  yield wait(.2);
  // string?
  let target = null;
  const claims = items.filter(i => i.paper.kind === 'claim' && !i.removing && i !== it);
  const evs = items.filter(i => i.paper.kind === 'ev' && !i.removing && i !== it && !strings.some(st => st.a === i || st.b === i));
  if (it.paper.kind === 'ev' && claims.length && (forceLink > 0 || rnd() < .85)) {
    claims.sort((p, q) => Math.hypot(p.slot.x - s.x, p.slot.y - s.y) - Math.hypot(q.slot.x - s.x, q.slot.y - s.y));
    target = rnd() < .7 ? claims[0] : pick(claims);
  } else if (it.paper.kind === 'claim' && evs.length && rnd() < .35) target = pick(evs); // else: a hypothesis, no evidence yet
  if (target) {
    forceLink = Math.max(0, forceLink - 1);
    let kind = 'sup'; if (forceContra > 0) { kind = 'contra'; forceContra--; } else if (rnd() < .13) kind = 'contra';
    const st = it.paper.kind === 'ev' ? addString(it, target, kind) : addString(target, it, kind);
    const a = pinPos(st.a), z = pinPos(st.b);
    b.arm.p = 1;
    yield anim(.35, (b, p) => { const P = pinPos(it); b.arm.tx = lerp(s.x, P.x, p); b.arm.ty = lerp(s.y, P.y, p); });
    const from = it === st.a ? a : z, to = it === st.a ? z : a, rev = it !== st.a;
    yield anim(1.1, (b, p) => { const e = ease(p); st.prog = rev ? 1 : e; st.revProg = rev ? e : 0; const q = curvePt(from, to, e); b.arm.tx = q.x; b.arm.ty = q.y; });
    st.prog = 1; st.revProg = 0;
    const end = pinPos(target); fx.push({ x: end.x, y: end.y, t: 0, kind: 'ring' });
  }
  yield anim(.4, (b, p) => { b.arm.p = 1 - ease(p); });
  b.arm = null;
  yield* happy(b);
}

function* wander(b) {
  yield mv(rr(170, 520), rr(360, 440));
  b.face = pick([-1, 1]);
  yield wait(rr(.6, 1.8));
}

function* archive(b) {
  // archive orphans first, then the oldest evidence; keep a few claims (and their strings) on the board
  const live = items.filter(i => !i.removing);
  const claimsN = live.filter(i => i.paper.kind === 'claim').length;
  const linked = i => strings.some(s => !s.fading && (s.a === i || s.b === i));
  const score = i => (i.paper.kind === 'claim' && claimsN <= 4 ? 1e6 : 0) + (linked(i) ? 1e3 : 0) + (i.born - T) * -1 * -1;
  live.sort((p, q) => score(p) - score(q));
  const it = live[0]; it.removing = true; archiving = true;
  yield mv(it.slot.x + rr(-8, 8), 331);
  b.view = 'back';
  yield* reach(b, it.slot.x, it.slot.y, .8, b => {
    strings.forEach(s => { if (s.a === it || s.b === it) s.fading = true; });
    items.splice(items.indexOf(it), 1); it.slot.item = null;
    b.carry = it.paper; b.carryScale = .55; archiving = false;
  });
  b.carryScale = .55;
  yield* fileInto(b);
}

function* ponder(b) {
  if (!archiving && items.filter(i => !i.removing).length >= 13) { yield* archive(b); return; }
  const live = strings.filter(s => s.prog >= 1 && !s.fading);
  let focus = null, fxX;
  if (live.length && rnd() < .85) {
    const contras = live.filter(s => s.kind === 'contra');
    focus = contras.length && rnd() < .5 ? pick(contras) : pick(live);
    fxX = (focus.a.slot.x + focus.b.slot.x) / 2;
  } else if (items.length) fxX = pick(items).slot.x; else { yield* wander(b); return; }
  let best = null, bestD = -1;
  for (let i = 0; i < 10; i++) {
    const cx = clamp(fxX + rr(-60, 60), 565, 905), cy = rr(372, 428);
    const d = Math.min(999, ...bots.filter(o => o !== b && o.spot).map(o => Math.hypot((o.spot.x - cx) * .8, (o.spot.y - cy) * 2)));
    if (d > bestD) { bestD = d; best = { x: cx, y: cy }; }
  }
  b.spot = best;
  yield mv(best.x, best.y);
  b.view = 'back';
  if (focus) focus.glow++;
  const dur = rr(4, 6.5), sym = focus && focus.kind === 'contra' ? '?!' : '?', aha = rnd() < .5;
  b.ponder = { p: 0, sym, aha };
  yield anim(dur, (b, p) => {
    b.ponder.p = p;
    b.tilt = Math.sin(p * dur * 1.6) * .16;
    b.view = (p > .5 && p < .68) ? 'front' : 'back';
  });
  b.tilt = 0; b.ponder = null; b.spot = null; if (focus) focus.glow--;
  if (aha) { b.idea = 1; yield* happy(b, .6); }
  yield wait(rr(.3, 1.2));
}

const ROLES = {
  filer: function* (b) { yield* fetchPaper(b); yield* fileInto(b); if (rnd() < .35) yield* wander(b); },
  pinner: function* (b) { yield* fetchPaper(b); yield* pinToBoard(b); if (rnd() < .25) yield* wander(b); },
  ponderer: function* (b) { yield* ponder(b); },
};

const bots = [
  new Bot('filer', 210, 365, '#f28b82', '#c95d55'),
  new Bot('filer', 320, 410, '#8fd3b6', '#5aa588'),
  new Bot('filer', 430, 355, '#f6d776', '#c9a842'),
  new Bot('pinner', 640, 380, '#8ab6f9', '#5a86c9'),
  new Bot('pinner', 790, 405, '#f7b68a', '#c98858'),
  new Bot('ponderer', 700, 430, '#b9a6f2', '#8a78c4'),
  new Bot('ponderer', 860, 395, '#6cc5c2', '#3f9795'),
];

function curvePt(a, b, t) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + 14 + Math.hypot(b.x - a.x, b.y - a.y) * .08;
  const u = 1 - t; return { x: u * u * a.x + 2 * u * t * mx + t * t * b.x, y: u * u * a.y + 2 * u * t * my + t * t * b.y };
}

// ---------- update ----------
function step(dt) {
  T += dt;
  tubePulse = Math.max(0, tubePulse - dt * 1.5);
  if (AUTO && !pendingDrops.length) { dropTimer -= dt; if (dropTimer <= 0) { dropTimer = rr(1.3, 2.6); dropPaper(rnd() < .22 ? 'claim' : 'ev'); } }
  if (pendingDrops.length) { pendingTimer -= dt; if (pendingTimer <= 0 && dropPaper(pendingDrops[0])) { pendingDrops.shift(); pendingTimer = .7; } }
  for (let i = inbox.falling.length - 1; i >= 0; i--) { const f = inbox.falling[i]; f.t += dt * 1.6; if (f.t >= 1) { inbox.stack.push(f.paper); inbox.falling.splice(i, 1); } }
  CABS.forEach(c => c.drawers.forEach(d => { d.open += (d.target - d.open) * Math.min(1, dt * 8); d.flash = Math.max(0, d.flash - dt * 2); }));
  items.forEach(it => { it.pop = Math.min(1, it.pop + dt * 3); });
  for (let i = strings.length - 1; i >= 0; i--) { const s = strings[i]; if (s.fading) { s.alpha -= dt * 1.5; if (s.alpha <= 0) strings.splice(i, 1); } }
  for (let i = fx.length - 1; i >= 0; i--) { fx[i].t += dt * 2; if (fx[i].t >= 1) fx.splice(i, 1); }
  bots.forEach(b => b.update(dt));
}

// ---------- drawing ----------
function drawBackground() {
  // wall
  let g = ctx.createLinearGradient(0, 0, 0, 300); g.addColorStop(0, '#f7ebda'); g.addColorStop(1, '#efdcc3');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 302);
  ctx.fillStyle = 'rgba(160,110,70,.035)'; for (let x = 0; x < W; x += 36) ctx.fillRect(x, 0, 14, 300);
  // floor
  g = ctx.createLinearGradient(0, 300, 0, H); g.addColorStop(0, '#d9b590'); g.addColorStop(1, '#c79c74');
  ctx.fillStyle = g; ctx.fillRect(0, 300, W, H - 300);
  ctx.strokeStyle = 'rgba(110,70,40,.13)'; ctx.lineWidth = 1;
  let y = 306, k = 0;
  while (y < H) { const hgt = 10 + k * 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();

  drawBackground();
  drawCabinets();
  drawBoard();
  drawPlant(507, 312, .9, 1);
  drawTubeAndInbox();
  drawFx();
  [...bots].sort((a, b) => a.y - b.y).forEach(drawBot);
  drawDesk();
  drawPlant(918, 548, 1.6, 1.5);
  // warm light + vignette
  let g = ctx.createRadialGradient(560, 60, 20, 560, 60, 520); g.addColorStop(0, 'rgba(255,236,190,.16)'); g.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05); g.addColorStop(0, 'rgba(40,20,40,0)'); g.addColorStop(1, 'rgba(40,20,40,.28)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- loop / API ----------
const DT = 1 / 60;
window.__advance = (sec) => { const n = Math.round(sec / DT); for (let i = 0; i < n; i++) step(DT); render(); };
window.botOffice = {
  evidence(n = 1) { for (let i = 0; i < n; i++) pendingDrops.push('ev'); },
  claim(n = 1) { for (let i = 0; i < n; i++) pendingDrops.push('claim'); },
  link() { forceLink++; },
  contradiction() { forceContra++; },
};
const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduceMotion = motion.matches;
if (!CAPTURE) {
  let last = performance.now(), acc = 0, raf = 0;
  const loop = (now) => {
    if (reduceMotion) { render(); raf = 0; return; }
    acc += Math.min(.1, (now - last) / 1000); last = now; while (acc >= DT) { step(DT); acc -= DT; } render();
    raf = requestAnimationFrame(loop);
  };
  const syncMotion = () => {
    reduceMotion = motion.matches;
    if (reduceMotion) { if (raf) cancelAnimationFrame(raf); raf = 0; render(); return; }
    if (!raf) { last = performance.now(); acc = 0; raf = requestAnimationFrame(loop); }
  };
  if (motion.addEventListener) motion.addEventListener('change', syncMotion);
  syncMotion();
} else render();
})();
</script>
