<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paranoy · Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/site.css?v=SITE_V">
<style>
:root{--new:#4a4220}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:11.5px var(--sans);color:var(--ink)}
.top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 14px}
.live{display:flex;align-items:center;gap:6px;color:var(--ink3);font-family:var(--mono);font-size:11px;margin-left:auto}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
.live.err .dot{background:var(--bad);animation:none}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 50%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.strip{display:flex;flex-wrap:wrap;padding:2px 0}.kpi{display:flex;align-items:baseline;gap:5px;padding:2px 10px 2px 0;margin-right:8px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}.kpi .v{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.kpi .k{color:var(--ink3);font-size:11px}
.kpi.err .v{color:var(--bad)}.kpi.sep{border-right:0;width:10px;padding:0;margin:0}
main{padding:10px 14px 18px;display:grid;gap:10px}main[hidden]{display:none}
.row{display:grid;gap:10px}.charts{grid-template-columns:1.3fr 1fr 1fr 1.1fr}.feeds{grid-template-columns:1fr 1fr}
@media(max-width:1400px){.charts{grid-template-columns:1fr 1fr}}@media(max-width:900px){.charts,.feeds{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2)}
h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink3);font-family:var(--mono);font-size:10.5px}.legend{display:flex;gap:10px;color:var(--ink3);font-size:10.5px;white-space:nowrap}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chart{padding:8px 10px 4px}.chart svg{display:block;width:100%;height:84px}.axis{display:flex;justify-content:space-between;color:var(--ink3);font-family:var(--mono);font-size:10px;padding:2px 10px 7px}
.bars{display:grid;grid-template-columns:max-content 1fr max-content max-content;gap:4px 8px;align-items:center;padding:8px 10px;overflow:auto;max-height:238px}
.bars .nm{font-family:var(--mono);font-size:11px}.bars .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}.bars .ms{color:var(--ink3);font-family:var(--mono);font-size:10px;text-align:right}
.track{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:3px}
table.dense{width:100%;border-collapse:collapse;font-size:11.5px}.dense td{padding:4px 8px;border-top:1px solid var(--line2);vertical-align:top;line-height:1.35}.dense tr:first-child td{border-top:0}
td.t{color:var(--ink3);font-family:var(--mono);font-size:10.5px;white-space:nowrap;width:1%}td.k{font-family:var(--mono);font-size:11px;white-space:nowrap;width:1%}
td.a{color:var(--ink2);font-family:var(--mono);font-size:10.5px;white-space:nowrap;width:1%;max-width:140px;overflow:hidden;text-overflow:ellipsis}td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;width:1%}
td.s{word-break:break-word;color:var(--ink)}td.s.err{color:var(--bad)}td.ev{width:1%;padding-top:7px}
.tag{display:inline-block;padding:0 5px;border-radius:3px;background:var(--line2);color:var(--ink2);font-family:var(--mono);font-size:10px;line-height:16px;white-space:nowrap}
.seg{display:flex;gap:2px;width:96px;height:8px}.seg i{display:block;height:100%;border-radius:2px}.seg.empty{background:var(--line2);border-radius:2px}
.cnt{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap}.cnt b{font-weight:600}.cnt .g{color:var(--good)}.cnt .w{color:var(--warn)}.cnt .c{color:var(--crit)}
tr.rec{cursor:pointer}tr.rec:hover td{background:var(--accent2)}tr.sel td{background:var(--accent2)}
tr.new td{animation:flash 5s ease-out}@keyframes flash{from{background:var(--new)}to{background:transparent}}
.scroll{overflow:auto;max-height:44vh}.scroll.tall{max-height:calc(100vh - 170px)}.empty{color:var(--ink3);padding:10px;font-size:11.5px}
.cols{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}.cols b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);flex-wrap:wrap}.tools .grow{flex:1}
.tools select,.tools input{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 7px}.tools input{min-width:280px}.tools label{display:flex;gap:4px;align-items:center;color:var(--ink2)}
@media(max-width:600px){.tools input{min-width:0;flex:1 1 140px}}
.pg{background:var(--panel);border:1px solid var(--line);border-radius:4px;width:24px;height:24px;cursor:pointer;color:var(--ink2)}.pg:disabled{opacity:.4;cursor:default}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.14);transform:translateX(100%);transition:transform .18s ease;z-index:10;display:flex;flex-direction:column}
#drawer.open{transform:none}.dh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:11.5px}
.dh .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dh button{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:4px;height:22px;min-width:22px;padding:0 6px;cursor:pointer;font-size:12px;line-height:1}
.dbody{padding:12px 14px;overflow:auto;flex:1}.big{font-size:13.5px;line-height:1.5;margin:0 0 10px}.big.q{font-style:italic;color:var(--ink2)}
.kv{display:flex;gap:10px;font-size:11.5px;padding:2px 0}.kk{color:var(--ink3);width:76px;flex:none;font-family:var(--mono);font-size:10.5px;padding-top:1px}.kv2{min-width:0;word-break:break-word}
h3{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:16px 0 4px}
.li{padding:6px 0;border-top:1px solid var(--line2);font-size:11.5px}.li .q{color:var(--ink2);font-style:italic;margin-top:2px}.li .r{color:var(--ink3);font-size:11px;margin-top:2px}
a.idl{font-family:var(--mono);color:var(--accent);text-decoration:none;font-size:10.5px;padding:0 3px;border-radius:3px;background:var(--accent2)}a.idl:hover{text-decoration:underline}
a.ext{color:var(--accent);word-break:break-all}pre.content{white-space:pre-wrap;word-break:break-word;font:11px/1.45 var(--mono);max-height:320px;overflow:auto;background:var(--bg);padding:8px;border-radius:4px;margin:0}
details{margin-top:14px}summary{cursor:pointer;color:var(--ink3);font-size:11px}details pre{font:10.5px/1.4 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.seg.lg{width:160px;height:10px;margin:6px 0 10px}
table.wide th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);white-space:nowrap}
table.wide th.n{text-align:right}.spark{width:120px;height:18px;display:block}td.sp{width:1%;padding:3px 8px}
.cp{background:none;border:0;color:var(--ink3);cursor:pointer;padding:0 3px;font-size:11px}.cp:hover{color:var(--ink)}
tr.grp td{background:var(--bg);color:var(--ink2);font-weight:600;font-size:11px;padding:7px 8px 4px;border-top:1px solid var(--line)}tr.grp td span{color:var(--ink3);font-weight:400}
td.ind{padding-left:20px}.errbtn{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit;text-decoration:underline dotted}
tr.errs td{background:var(--bg);font-size:11px;color:var(--ink2)}tr.errs li{margin:2px 0}tr.errs b{color:var(--bad);font-family:var(--mono)}
.kindtag{display:inline-block;padding:0 5px;border-radius:3px;font-family:var(--mono);font-size:10px;line-height:16px;background:var(--accent2);color:var(--accent)}.kindtag.human{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.kindtag.unreg{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.strip2{display:flex;flex-wrap:wrap}.srow{grid-template-columns:minmax(300px,1fr) 2.2fr}@media(max-width:1100px){.srow{grid-template-columns:1fr}}
.bars.dom{grid-template-columns:max-content 1fr max-content max-content;max-height:calc(100vh - 230px)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}.grid4 .cell{background:var(--bg);border-radius:4px;padding:6px 8px}.grid4 .v{font-family:var(--mono);font-size:14px;font-weight:600}.grid4 .k{color:var(--ink3);font-size:10.5px}
.ext2{color:var(--ink3);font-family:var(--mono);font-size:10.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.card{cursor:pointer}.card:hover{border-color:var(--accent)}.card .ph h2{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-family:var(--mono)}
.card.add{display:flex;align-items:center;justify-content:center;min-height:140px;border-style:dashed;text-decoration:none;color:var(--ink3);gap:10px;font-size:13px}
.card.add b{font-size:32px;font-weight:300;line-height:1;color:var(--accent)}.card.add:hover{color:var(--ink)}
.card .nm2{padding:8px 10px 0;color:var(--ink2);font-size:12px}.card .grid4{margin:8px 10px 10px}.card .grid4 .v{font-size:16px}
.storage{max-width:560px}.bars.tbl{max-height:none}
</style></head><body>
<!--HEADER-->
<div class="top" id="main" tabindex="-1"><div class="strip" id="strip"></div><div class="live" id="live"><i class="dot"></i><span id="status">connecting</span></div></div>
<main id="collections" class="tabpane">
  <section class="cards" id="ccards"></section>
  <section class="panel storage"><div class="ph"><h2>Storage <span style="text-transform:none;letter-spacing:0">· your collections</span></h2><span class="muted" id="dbsize"></span></div><div class="bars tbl" id="tables"></div></section>
</main>
<main id="activity" class="tabpane" hidden>
  <section class="row charts">
    <div class="panel"><div class="ph"><h2>Calls per minute</h2><span class="legend"><span><i style="background:var(--accent)"></i>ok</span><span><i style="background:var(--bad)"></i>error</span></span></div>
      <div class="chart"><svg id="callsChart" preserveAspectRatio="none"></svg></div><div class="axis"><span>−60m</span><span>−30m</span><span>now</span></div></div>
    <div class="panel"><div class="ph"><h2>Records per minute</h2><span class="muted" id="recRate"></span></div>
      <div class="chart"><svg id="recChart" preserveAspectRatio="none"></svg></div><div class="axis"><span>−60m</span><span>−30m</span><span>now</span></div></div>
    <div class="panel"><div class="ph"><h2>Calls by tool</h2><span class="muted" id="toolNote"></span></div><div class="bars" id="bytool"></div></div>
    <div class="panel"><div class="ph"><h2>Agents</h2><span class="muted" id="authNote"></span></div><div class="scroll" style="max-height:238px"><table class="dense" id="byauthor"></table></div></div>
  </section>
  <section class="row feeds">
    <div class="panel"><div class="ph"><h2>Recent records</h2><span class="cols" id="cols"></span></div><div class="scroll"><table class="dense" id="records"></table></div></div>
    <div class="panel"><div class="ph"><h2>Recent calls</h2><span class="muted" id="callsNote"></span></div><div class="scroll"><table class="dense" id="calls"></table></div></div>
  </section>
</main>
<main id="browse" class="tabpane" hidden>
  <section class="panel">
    <div class="tools">
      <select id="bkind"><option value="claim">claims</option><option value="evidence">evidence</option><option value="link">links</option><option value="contradiction">contradictions</option></select>
      <select id="bcol"><option value="">all collections</option></select>
      <input id="bq" placeholder="filter text…" autocomplete="off">
      <label id="bsemwrap" title="semantic search over claim embeddings"><input type="checkbox" id="bsem"> semantic</label>
      <select id="bsort"><option value="recent">newest</option><option value="links">most links</option><option value="contested">most contested</option><option value="unsupported">fewest links</option></select>
      <span class="legend" id="blegend"><span><i style="background:var(--good)"></i>supports</span><span><i style="background:var(--warn)"></i>qualifies</span><span><i style="background:var(--crit)"></i>rebuts</span></span>
      <span class="grow"></span><span class="muted" id="bnote"></span><button class="pg" id="bprev">‹</button><button class="pg" id="bnext">›</button>
    </div>
    <div class="scroll tall"><table class="dense" id="bresults"></table></div>
  </section>
</main>
<main id="agents" class="tabpane" hidden>
  <section class="panel">
    <div class="ph"><h2>Agents</h2><span class="muted" id="anote"></span></div>
    <div class="scroll tall"><table class="dense wide" id="atable"></table></div>
  </section>
</main>
<main id="npubs" class="tabpane" hidden>
  <section class="panel">
    <div class="ph"><h2>Npubs</h2><span class="muted" id="nnote"></span></div>
    <div class="scroll tall"><table class="dense wide" id="ntable"></table></div>
  </section>
</main>
<main id="sources" class="tabpane" hidden>
  <section class="strip2" id="sstrip"></section>
  <section class="row srow">
    <div class="panel"><div class="ph"><h2>Evidence by URL domain</h2><span class="muted" id="dnote"></span></div><div class="bars dom" id="domains"></div></div>
    <div class="panel">
      <div class="tools"><input id="sq" placeholder="filter sources…" autocomplete="off"><select id="ssort"><option value="evidence">most evidence</option><option value="links">most links</option><option value="recent">recently used</option><option value="name">name</option></select><span class="grow"></span><span class="muted" id="snote"></span></div>
      <div class="scroll tall"><table class="dense wide" id="stable"></table></div>
    </div>
  </section>
</main>
<aside id="drawer" role="dialog" aria-label="Record">
  <div class="dh"><button id="dback" title="back">‹</button><span class="ttl" id="drawerTitle"></span><button onclick="hideDetail()" title="close (Esc)">×</button></div>
  <div class="dbody" id="dbody"></div>
</aside>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = iso => { if (!iso) return ''; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? `${s|0}s` : s < 3600 ? `${(s/60)|0}m` : s < 86400 ? `${(s/3600)|0}h` : `${(s/86400)|0}d`; };
const hm = t => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
// Event IDs are 64 hex chars; show the first 10, open the drawer with the whole one.
const link = id => id ? `<a href="#" class="idl" data-id="${esc(id)}" title="${esc(id)}">${esc(String(id).slice(0, 10))}</a>` : '';
// Keys show as names; with no profile, a short npub. Hover shows the whole npub, and ⧉ copies it.
const B32 = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function npubOf(hex) {
  if (!/^[0-9a-f]{64}$/.test(hex || '')) return String(hex || '');
  const pm = v => { let c = 1; for (const x of v) { const t = c >>> 25; c = ((c & 0x1ffffff) << 5) ^ x;
    [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3].forEach((g, i) => { if ((t >>> i) & 1) c ^= g; }); } return c >>> 0; };
  const d = []; let acc = 0, bits = 0;
  for (const b of hex.match(/../g).map(h => parseInt(h, 16))) { acc = (acc << 8) | b; bits += 8; while (bits >= 5) { bits -= 5; d.push((acc >> bits) & 31); } }
  if (bits) d.push((acc << (5 - bits)) & 31);
  const hrp = [3, 3, 3, 3, 0, 14, 16, 21, 2], m = pm([...hrp, ...d, 0, 0, 0, 0, 0, 0]) ^ 1;
  return 'npub1' + [...d, ...[0, 1, 2, 3, 4, 5].map(i => (m >> (5 * (5 - i))) & 31)].map(v => B32[v]).join('');
}
const shortNpub = pk => { const n = npubOf(pk); return n.length > 20 ? n.slice(0, 12) + '…' + n.slice(-4) : n; };
const who = (author, pk) => `<span title="${esc(npubOf(pk))}">${esc(author || shortNpub(pk))}</span>`;
const copyBtn = pk => `<button class="cp" type="button" data-copy="${esc(npubOf(pk))}" aria-label="Copy npub" title="Copy npub">⧉</button>`;
const seenRec = new Set(), seenCall = new Set(); let first = true, selected = null, colsKnown = '';
async function api(path) {  // the cookie expired: back to the ledger home to log in again
  // A request that never settles would stall its polling loop, so give up after a minute.
  const r = await fetch('/dashboard/api/' + path, {signal: AbortSignal.timeout(60000)});
  if (r.status === 401) { location.href = '/'; throw new Error('not logged in'); }
  return r.json();
}

// ---- activity -------------------------------------------------------------
function series(rows) {
  const now = new Date(); now.setSeconds(0, 0);
  const map = new Map(rows.map(r => [new Date(r.m).getTime(), r]));
  const out = [];
  for (let i = 59; i >= 0; i--) { const t = now.getTime() - i * 60000; const r = map.get(t) || {}; out.push({t, n: r.n || 0, errors: r.errors || 0}); }
  return out;
}
function bars(svg, data, unit, withErrors) {
  const W = 600, H = 84, max = Math.max(1, ...data.map(d => d.n));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = data.map((d, i) => {
    const x = i * 10 + 1, h = d.n ? Math.max(2, Math.round((H - 6) * d.n / max)) : 0;
    const eh = withErrors && d.errors ? Math.max(2, Math.round((H - 6) * d.errors / max)) : 0;
    const tip = `${hm(d.t)} · ${d.n} ${unit}${eh ? ` · ${d.errors} errors` : ''}`;
    return `<g><title>${esc(tip)}</title><rect x="${x - 1}" y="0" width="10" height="${H}" fill="transparent"/>` +
      (h ? `<rect x="${x}" y="${H - 2 - h}" width="8" height="${h}" rx="1.5" fill="var(--accent)"/>` : '') +
      (eh ? `<rect x="${x}" y="${H - 2 - eh}" width="8" height="${eh}" rx="1.5" fill="var(--bad)"/>` : '') + `</g>`;
  }).join('') + `<line x1="0" y1="${H - 1.5}" x2="${W}" y2="${H - 1.5}" stroke="var(--line)" stroke-width="1"/>`;
}
const kpi = (k, v, cls = '') => `<div class="kpi ${cls}"><span class="v">${esc(v)}</span><span class="k">${esc(k)}</span></div>`;
function render(d) {
  const c = d.counts, m = d.calls;
  $('strip').innerHTML = ['evidence', 'claims', 'links', 'contradictions', 'contributors', 'collections'].map(k => kpi(k, c[k])).join('')
    + '<div class="kpi sep"></div>' + kpi('calls', m.total) + kpi('writes', m.writes) + kpi('errors', m.errors, m.errors ? 'err' : '')
    + kpi('last hour', m.last_hour) + kpi('last 5 min', m.last_5m) + kpi('active keys', m.active_authors);
  $('cols').innerHTML = d.collections.map(x => `<span><b>${esc(x.slug)}</b> ${esc(x.evidence)}e ${esc(x.claims)}c ${esc(x.links)}l ${esc(x.contradictions)}k</span>`).join('');
  const key = d.collections.map(x => x.slug).join(',');
  if (key !== colsKnown) { colsKnown = key; const sel = $('bcol'), cur = sel.value;
    sel.innerHTML = '<option value="">all collections</option>' + d.collections.map(x => `<option value="${esc(x.slug)}">${esc(x.slug)}</option>`).join(''); sel.value = cur; }
  const cs = series(d.calls_per_min), rs = series(d.records_per_min);
  bars($('callsChart'), cs, 'calls', true); bars($('recChart'), rs, 'events', false);
  $('recRate').textContent = `${rs.reduce((a, b) => a + b.n, 0)} in 60m`;
  const tmax = Math.max(1, ...d.by_tool.map(t => t.n));
  $('toolNote').textContent = d.by_tool.length ? `${d.by_tool.length} tools` : '';
  $('bytool').innerHTML = d.by_tool.length ? d.by_tool.map(t =>
    `<span class="nm">${esc(t.name)}</span><div class="track"><div class="fill" style="width:${(100 * t.n / tmax).toFixed(1)}%"></div></div>` +
    `<span class="n">${esc(t.n)}${t.errors ? ` <span style="color:var(--bad)">·${esc(t.errors)}</span>` : ''}</span><span class="ms">${esc(t.avg_ms)}ms</span>`).join('')
    : '<div class="empty">no calls recorded yet</div>';
  $('authNote').textContent = d.by_author.length ? `${d.by_author.length} seen` : '';
  $('byauthor').innerHTML = d.by_author.length ? d.by_author.map(a =>

  h += kv('id', `<span class="muted">${esc(r.id)}</span>`) + kv('author', `${esc(r.author || shortNpub(r.pubkey))} <span class="muted">${esc(npubOf(r.pubkey))}</span>${copyBtn(r.pubkey)}`) + kv('collection', esc(r.collection))
    + kv('created', unix(r.created_at) + ' <span class="muted">(signer-claimed)</span>') + kv('received', `${esc(r.received_at)} <span class="muted">· ${ago(r.received_at)} ago</span>`);
  if (kind === 'link' && r.target) h += `<h3>Target</h3><div class="li">${link(r.target.id)} <span class="tag">${esc(r.target.kind)}</span> ${esc(r.target.summary || '')}</div>`;
  if (kind === 'link' && r.evidence) h += `<h3>Evidence</h3><div class="li">${link(r.evidence.id)} ${esc(r.evidence.title || r.evidence.url || r.evidence.source || '')} <span class="muted">· ${esc(r.evidence.chars)} chars</span></div>`;
  h += list('Member claims', r.claims, x => `<div class="li">${link(x.id)} ${esc(x.text)} <span class="muted">· ${who(x.author, x.pubkey)}</span></div>`);
  h += list(kind === 'claim' ? 'Links' : 'Links targeting this', r.links, lnLine);
  h += list('Contradictions', r.contradictions, k => `<div class="li">${link(k.id)} ${esc(k.reason)}<div class="r">${(k.claim_ids || []).map(link).join(' ')}${k.link_count ? ` · ${k.link_count} links on it` : ''}</div></div>`);
  h += list('Links grounded here', r.links_from, lnLine);
  if (kind === 'evidence' && c.text) h += `<h3>Text <span class="muted">first ${c.text.length} of ${esc(r.chars)} chars</span></h3><pre class="content">${esc(c.text)}</pre>`;
  h += `<details><summary>signed event${r.raw_truncated ? ' (content truncated here; the export has it whole)' : ''}</summary><pre>${esc(JSON.stringify(r.raw, null, 2))}</pre></details>`;
  return h;
}
async function showDetail(id, push = true) {
  if (push && selected && selected !== id) hist.push(selected);
  selected = id; document.querySelectorAll('tr.rec').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === id));
  $('drawer').classList.add('open'); $('drawerTitle').textContent = id.slice(0, 16); $('dback').style.visibility = hist.length ? 'visible' : 'hidden';
  $('dbody').innerHTML = '<div class="empty">loading…</div>';
  try { const d = await api('record/' + encodeURIComponent(id));
    if (!d.error) $('drawerTitle').textContent = `${d.kind} ${id.slice(0, 16)}`;
    $('dbody').innerHTML = d.error ? `<div class="empty">${esc(d.error)}</div>` : renderRecord(d); }
  catch (e) { $('dbody').innerHTML = `<div class="empty">${esc(e)}</div>`; }
}
function hideDetail() { selected = null; hist.length = 0; $('drawer').classList.remove('open'); document.querySelectorAll('tr.sel').forEach(tr => tr.classList.remove('sel')); }
$('dback').onclick = () => { const prev = hist.pop(); if (prev) showDetail(prev, false); };
document.addEventListener('click', e => {
  const a = e.target.closest('a.idl'); if (a) { e.preventDefault(); showDetail(a.dataset.id); return; }
  const tr = e.target.closest('tr.rec');
  if (tr && tr.dataset.id) { showDetail(tr.dataset.id); return; }
  if (tr && 'source' in tr.dataset) {  // a source row: browse its evidence
    B.kind = 'evidence'; $('bkind').value = 'evidence'; B.q = tr.dataset.source; $('bq').value = B.q; bshown = true; showTab('browse'); rebrowse(); return; }
  const card = e.target.closest('.card[data-col]'); if (card) { B.col = card.dataset.col; $('bcol').value = B.col; bshown = true; showTab('browse'); rebrowse(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideDetail(); });
// The snapshot is live (2 s) only on Activity; elsewhere it just feeds the header strip.
const snapNow = every(() => activeTab === 'activity' ? 2000 : 30000, poll);
const tabNow = every(() => 30000, () => activeTab === 'collections' ? loadCollections() : activeTab === 'agents' ? loadAgents()
  : activeTab === 'sources' && !S.q ? loadSources() : null);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { snapNow(); tabNow(); } });
// /dashboard#record=<id> opens that record, for links from the chat on other pages.
const deep = location.hash.match(/^#record=([0-9a-f]{64})$/);
showTab(deep ? 'collections' : location.hash.slice(1)); snapNow();
if (deep) showDetail(deep[1]);
</script></body></html>
