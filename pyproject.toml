[project]
name = "tmsv2"
version = "0.1.0"
description = "Append-only evidence ledger with an MCP surface"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "trafilatura>=2",
    "uvicorn>=0.30",
]

[project.scripts]
tms-server = "tms.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tms"]
